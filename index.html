<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Livro-Caixa do Casal</title>
<meta name="description" content="Finanças do casal: painel, lançamentos do mês, faturas e acerto entre os dois, planilha mês a mês, parcelamentos, metas e simulador de compras.">
<meta name="theme-color" content="#edf2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livro-Caixa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="assets/icones/icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icones/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css?v=2026.10.26.1">
</head>
<body>
<div class="app" id="app" data-pv="casal">
  <aside class="rail" aria-label="Navegação principal">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="var(--ink)"/><path d="M7 11.5h18M7 16.5h18M7 21.5h18" stroke="var(--on-ink)" stroke-opacity=".55" stroke-width="1.4"/><path d="M11.5 6v20M13.8 6v20" stroke="var(--margin)" stroke-width="1.4"/></svg>
      <div><strong>Livro-Caixa</strong><span>do Casal</span></div>
    </div>
    <nav class="rail-nav" id="rail-nav"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <main class="view" id="view" tabindex="-1">
      <section class="card empty"><span class="eyebrow">Livro-Caixa do Casal</span><h2 class="ct">Abrindo o livro-caixa…</h2><p class="sub">Receitas, parcelas de cartão, contas fixas e metas aparecem aqui assim que os dados chegarem.</p></section>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  <button class="fab" id="fab" type="button" data-act="novo" aria-label="Novo lançamento" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Novo lançamento</span></button>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="f-restore" accept="application/json,.json" hidden>
</div>

<div class="porta" id="porta" hidden></div>
<script src="js/nuvem-config.js?v=2026.10.26.1"></script>
<script src="js/nuvem.js?v=2026.10.26.1"></script>
<script src="js/app.js?v=2026.10.26.1"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* sem modo off-line */ }));
}
</script>
</body>
</html>
